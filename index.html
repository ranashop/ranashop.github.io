<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top Up Game 3D Cyber</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom 3D Shadow & Glow Effects */
    .glow-banner {
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.2);
    }
    .card-3d {
      background: rgba(22, 27, 46, 0.75);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }
    .btn-3d {
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      box-shadow: 0 6px 0px #4c1d95, 0 10px 20px rgba(168, 85, 247, 0.4);
      transition: all 0.1s ease;
    }
    .btn-3d:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0px #4c1d95, 0 4px 10px rgba(168, 85, 247, 0.4);
    }
    .floating {
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }
  </style>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen pb-12 overflow-x-hidden">

  <!-- BACKGROUND DEKORASI RAME (3D Particles Glow) -->
  <div class="fixed inset-0 pointer-events-none">
    <div class="absolute top-10 left-10 w-72 h-72 bg-purple-600/30 rounded-full blur-3xl"></div>
    <div class="absolute bottom-10 right-10 w-96 h-96 bg-cyan-500/20 rounded-full blur-3xl"></div>
  </div>

  <div class="max-w-4xl mx-auto px-4 pt-6 relative z-10 space-y-6">

    <!-- BANNER UTAMA (Rame & 3D Visual) -->
    <div class="relative rounded-3xl overflow-hidden p-8 border-2 border-purple-500/50 glow-banner bg-gradient-to-r from-purple-900/80 via-indigo-900/80 to-slate-900/90 flex flex-col md:flex-row items-center justify-between">
      <div class="space-y-3 z-10 text-center md:text-left">
        <span class="px-3 py-1 bg-yellow-400 text-black font-extrabold text-xs rounded-full uppercase tracking-wider shadow-lg shadow-yellow-400/50">⚡ Instant Top-Up</span>
        <h1 class="text-3xl md:text-5xl font-black italic tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-pink-400 to-cyan-400 drop-shadow-md">
          ULTRA GAMING STORE
        </h1>
        <p class="text-slate-300 text-sm max-w-md">Proses serba kilat, 24/7 otomatis. Pilih item impianmu dan jadilah juara!</p>
      </div>
      
      <!-- Visual Element 3D (Floating Coins/Shield) -->
      <div class="relative mt-6 md:mt-0 z-10 flex items-center justify-center">
        <div class="w-36 h-36 bg-gradient-to-tr from-cyan-400 to-purple-600 rounded-2xl rotate-12 floating flex items-center justify-center text-6xl shadow-2xl border-4 border-white/20">
          💎
        </div>
        <div class="absolute -top-4 -left-6 text-4xl floating" style="animation-delay: 1s;">🪙</div>
        <div class="absolute -bottom-2 -right-4 text-4xl floating" style="animation-delay: 2s;">⚡</div>
      </div>
    </div>

    <!-- MAIN FORM CONTAINER -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- STEP 1: AKUN USER -->
      <div class="card-3d p-6 rounded-2xl md:col-span-1 flex flex-col justify-between">
        <div>
          <div class="flex items-center gap-3 mb-4">
            <span class="w-8 h-8 rounded-lg bg-purple-600 font-bold flex items-center justify-center shadow-md">1</span>
            <h2 class="font-bold text-lg text-purple-300">Data Akun</h2>
          </div>
          <div class="space-y-4">
            <div>
              <label class="text-xs text-slate-400 font-medium block mb-1">USER ID / ACCOUNT ID</label>
              <input type="text" placeholder="Masukkan ID Game" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-purple-500 shadow-inner" />
            </div>
            <div>
              <label class="text-xs text-slate-400 font-medium block mb-1">SERVER / ZONE ID</label>
              <input type="text" placeholder="(Optional / 1234)" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-purple-500 shadow-inner" />
            </div>
          </div>
        </div>
        <div class="mt-6 p-3 bg-purple-950/40 rounded-xl border border-purple-800/40 text-xs text-purple-200 flex items-center gap-2">
          <span>🔒</span> Transaksi 100% Aman & Terverifikasi
        </div>
      </div>

      <!-- STEP 2: NOMINAL BEBAS / BEBAS PILIH MANDIRI -->
      <div class="card-3d p-6 rounded-2xl md:col-span-2 space-y-5">
        <div class="flex items-center gap-3">
          <span class="w-8 h-8 rounded-lg bg-cyan-600 font-bold flex items-center justify-center shadow-md">2</span>
          <h2 class="font-bold text-lg text-cyan-300">Pilih / Ketik Jumlah Top Up</h2>
        </div>

        <!-- Kolom Ketik Bebas Mandiri -->
        <div class="bg-slate-900/80 p-4 rounded-xl border border-cyan-500/30">
          <label class="text-xs text-cyan-400 font-bold uppercase tracking-wider block mb-2">✍️ Ketik Jumlah Bebas (Custom Amount)</label>
          <div class="relative">
            <input type="number" placeholder="Contoh: 720, 1500, 5000..." class="w-full bg-slate-950 border border-slate-700 rounded-xl py-3 px-4 text-lg font-bold text-yellow-400 focus:outline-none focus:border-cyan-400" />
            <span class="absolute right-4 top-3 text-xs text-slate-400 font-normal">Item / Diamond</span>
          </div>
        </div>

        <!-- Opsi Preset Acak / Random Fast Select -->
        <div>
          <label class="text-xs text-slate-400 font-medium block mb-3">Atau Pilih Nominal Cepat:</label>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            
            <button class="p-3 bg-slate-900/90 hover:bg-purple-900/50 border border-slate-700 hover:border-purple-400 rounded-xl flex flex-col items-center justify-center transition group">
              <span class="text-lg font-black text-cyan-400 group-hover:scale-110 transition">💎 86</span>
              <span class="text-xs text-slate-400 mt-1">Rp 20.000</span>
            </button>

            <button class="p-3 bg-slate-900/90 hover:bg-purple-900/50 border border-slate-700 hover:border-purple-400 rounded-xl flex flex-col items-center justify-center transition group">
              <span class="text-lg font-black text-cyan-400 group-hover:scale-110 transition">💎 257</span>
              <span class="text-xs text-slate-400 mt-1">Rp 60.000</span>
            </button>

            <button class="p-3 bg-slate-900/90 hover:bg-purple-900/50 border border-slate-700 hover:border-purple-400 rounded-xl flex flex-col items-center justify-center transition group">
              <span class="text-lg font-black text-cyan-400 group-hover:scale-110 transition">💎 706</span>
              <span class="text-xs text-slate-400 mt-1">Rp 160.000</span>
            </button>

            <button class="p-3 bg-slate-900/90 hover:bg-purple-900/50 border border-slate-700 hover:border-purple-400 rounded-xl flex flex-col items-center justify-center transition group">
              <span class="text-lg font-black text-yellow-400 group-hover:scale-110 transition">⚡ 1,412</span>
              <span class="text-xs text-slate-400 mt-1">Rp 310.000</span>
            </button>

            <button class="p-3 bg-slate-900/90 hover:bg-purple-900/50 border border-slate-700 hover:border-purple-400 rounded-xl flex flex-col items-center justify-center transition group">
              <span class="text-lg font-black text-yellow-400 group-hover:scale-110 transition">⚡ 2,195</span>
              <span class="text-xs text-slate-400 mt-1">Rp 480.000</span>
            </button>

            <button class="p-3 bg-slate-900/90 hover:bg-purple-900/50 border border-slate-700 hover:border-purple-400 rounded-xl flex flex-col items-center justify-center transition group">
              <span class="text-lg font-black text-yellow-400 group-hover:scale-110 transition">👑 5,532</span>
              <span class="text-xs text-slate-400 mt-1">Rp 1.200.000</span>
            </button>

          </div>
        </div>
      </div>

    </div>

    <!-- TOMBOL AKSITION UTAMA (3D POP-OUT) -->
    <div class="pt-4">
      <button class="btn-3d w-full py-4 rounded-2xl font-black text-xl tracking-wider text-white uppercase flex items-center justify-center gap-3 cursor-pointer">
        <span>🚀</span> BAYAR SEKARANG MANDIRI <span>🚀</span>
      </button>
    </div>

  </div>

</body>
</html>
