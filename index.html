<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RanaShop - Top Up Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .bg-card { background-color: #1e293b; border: 1px solid #334155; }
        .nominal-btn { background-color: #1e293b; border: 1px solid #334155; transition: 0.2s; }
        .nominal-btn:hover, .nominal-btn.active { border-color: #f59e0b; background-color: #334155; }
        .input-dark { background-color: #0f172a; border: 1px solid #334155; color: white; }
    </style>
</head>
<body class="p-4 max-w-4xl mx-auto">

    <!-- Header Banner -->
    <div class="rounded-2xl overflow-hidden mb-6 border border-slate-700 shadow-2xl">
        <img src="banner.jpg" alt="Banner Utama" class="w-full h-auto">
    </div>

    <!-- Grid Utama: Transaksi & Nominal -->
    <div class="grid md:grid-cols-3 gap-6">
        
        <!-- Kolom Kiri: Input Data -->
        <div class="md:col-span-1 space-y-4">
            <div class="bg-card p-5 rounded-xl">
                <h3 class="font-bold mb-4 flex items-center gap-2"><span class="bg-blue-600 px-2 py-0.5 rounded text-sm">1</span> Masukkan Data Akun</h3>
                <label class="text-xs text-slate-400">User ID</label>
                <input type="text" class="input-dark w-full p-2.5 rounded-lg mb-3 text-sm" placeholder="Masukkan User ID">
                <label class="text-xs text-slate-400">Server</label>
                <select class="input-dark w-full p-2.5 rounded-lg text-sm">
                    <option>Pilih Server</option>
                </select>
            </div>
        </div>

        <!-- Kolom Tengah & Kanan: Nominal & Pembayaran -->
        <div class="md:col-span-2 space-y-6">
            
            <!-- Pilih Nominal -->
            <div class="bg-card p-5 rounded-xl">
                <h3 class="font-bold mb-4 flex items-center gap-2"><span class="bg-blue-600 px-2 py-0.5 rounded text-sm">2</span> Pilih Nominal Diamond</h3>
                <div class="grid grid-cols-3 gap-3" id="listNominal">
                    <!-- Contoh 1 Nominal (Copy paste untuk buat banyak) -->
                    <button class="nominal-btn p-3 rounded-xl text-center active" onclick="pilihNominal(this, '5 Diamond', 'Rp 1.500')">
                        <div class="text-xs font-bold">5 Diamond</div>
                        <div class="text-xs text-amber-500 mt-1">Rp 1.500</div>
                    </button>
                    <button class="nominal-btn p-3 rounded-xl text-center" onclick="pilihNominal(this, '11 Diamond', 'Rp 2.500')">
                        <div class="text-xs font-bold">11 Diamond</div>
                        <div class="text-xs text-amber-500 mt-1">Rp 2.500</div>
                    </button>
                    <!-- Tambahkan tombol lainnya sesuai kebutuhan -->
                </div>
            </div>

            <!-- Pembayaran & Kontak -->
            <div class="bg-card p-5 rounded-xl">
                <h3 class="font-bold mb-4"><span class="bg-blue-600 px-2 py-0.5 rounded text-sm mr-2">4</span> Pilih Pembayaran</h3>
                <div class="space-y-2">
                    <label class="flex items-center gap-3 p-3 bg-slate-800 rounded-lg border border-slate-700 cursor-pointer">
                        <input type="radio" name="pay"> <span>SeaBank</span>
                    </label>
                    <label class="flex items-center gap-3 p-3 bg-slate-800 rounded-lg border border-slate-700 cursor-pointer">
                        <input type="radio" name="pay"> <span>DANA</span>
                    </label>
                </div>
            </div>

            <!-- Tombol Pesan -->
            <button class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-4 rounded-xl shadow-lg transition">
                PESAN SEKARANG via WhatsApp
            </button>
        </div>
    </div>

    <script>
        function pilihNominal(btn, nama, harga) {
            // Hapus class active dari semua tombol
            document.querySelectorAll('.nominal-btn').forEach(b => b.classList.remove('active'));
            // Tambahkan ke tombol yang diklik
            btn.classList.add('active');
            console.log("Dipilih: " + nama + " dengan harga " + harga);
        }
    </script>
</body>
</html>
